name: E2E Tests & Docs Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e2e-and-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────
  # E2E 테스트 (크로스 브라우저 병렬)
  # ─────────────────────────────────────
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 라이브러리 + docs 사이트 빌드
      - run: pnpm build

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # playwright.config.ts의 webServer가 docs start를 자동 실행
      - name: E2E 실행
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────
  # 문서 사이트 빌드 (Static Export)
  # ─────────────────────────────────────
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 문서 사이트 정적 Export
        run: pnpm --filter @kalyx/docs build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  # ─────────────────────────────────────
  # 문서 GitHub Pages 배포
  # ─────────────────────────────────────
  deploy-docs:
    name: Deploy Docs
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
