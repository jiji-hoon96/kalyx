name: Security Audit

on:
  schedule:
    # Monday 09:00 KST (UTC 00:00)
    - cron: '0 0 * * 1'
  push:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  security-events: write

jobs:
  osv-scan:
    # OSV-Scanner (Google) consumes pnpm-lock.yaml directly and queries the
    # osv.dev vulnerability database — independent of npm's deprecated
    # audit endpoint that `pnpm audit` still calls.
    name: OSV Vulnerability Scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: true

  license-check:
    name: License Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production dependencies use permissive licenses
        run: |
          npx license-checker \
            --production \
            --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;Python-2.0;CC0-1.0;Unlicense" \
            --excludePrivatePackages \
            --summary

  notify-on-failure:
    name: Create issue on failure
    needs: [osv-scan, license-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 [${date}] Dependency security issue detected`,
              body: [
                '## Security audit findings',
                '',
                'The automated security audit detected a vulnerability or license issue.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '## Next steps',
                '1. Inspect the failed job logs for details',
                '2. Reproduce locally with `pnpm exec osv-scanner --lockfile=pnpm-lock.yaml`',
                '3. Update the affected package: `pnpm update <package>`',
                '4. If no fix is available, add a `pnpm.overrides` entry pinning a safe version',
              ].join('\n'),
              labels: ['security', 'dependencies', 'automated'],
            });
