name: Security Audit

on:
  schedule:
    # Monday 09:00 KST (UTC 00:00)
    - cron: '0 0 * * 1'
  # Restrict push trigger to main so feature-branch force-pushes don't race with
  # branch deletion (the SARIF upload step references the original ref, and the
  # auto-merge + delete-branch flow can remove it before the upload completes,
  # causing a false-positive failure that auto-creates a noise issue).
  push:
    branches: [main]
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
  # No `paths` filter here, unlike the push trigger above: these two jobs are
  # required status checks on `main`, and required checks are matched by name.
  # A path-filtered workflow does not report skipped checks — it reports
  # nothing at all — so any PR that misses the filter (docs, tests, refactors:
  # most of them) would sit permanently pending. Both jobs finish in well
  # under two minutes, so running them unconditionally is cheap.
  pull_request:
  workflow_dispatch:

# Force-pushes to a PR branch would otherwise stack independent scan runs that
# all race to completion; the newest head is the only one a required check is
# evaluated against. Mirrors pr-check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  issues: write
  security-events: write

jobs:
  osv-scan:
    # OSV-Scanner (Google) consumes pnpm-lock.yaml directly and queries the
    # osv.dev vulnerability database — independent of npm's deprecated
    # audit endpoint that `pnpm audit` still calls.
    name: OSV Vulnerability Scan
    # ⚠️ This is a required status check on `main`, reported under the composed
    # name `OSV Vulnerability Scan / osv-scan` — the second half is the job id
    # *inside* the upstream reusable workflow. The @v2.0.0 pin is therefore
    # load-bearing: bumping it (or the tag moving) can rename the check and
    # leave every PR permanently pending. Update the ruleset's required
    # contexts in the same change as any version bump here.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.0.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      fail-on-vuln: true

  license-check:
    name: License Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production dependencies use permissive licenses
        run: |
          npx license-checker \
            --production \
            --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;Python-2.0;CC0-1.0;Unlicense" \
            --excludePrivatePackages \
            --summary

  notify-on-failure:
    name: Create issue on failure
    needs: [osv-scan, license-check]
    # Only file an issue for failures on main / scheduled runs / manual dispatch.
    # PR-context failures already surface in the PR's check list, so creating a
    # parallel tracking issue would be duplicate noise (and the issue body's
    # workflow link would point to a soon-to-be-deleted feature branch).
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 [${date}] Dependency security issue detected`,
              body: [
                '## Security audit findings',
                '',
                'The automated security audit detected a vulnerability or license issue.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '## Next steps',
                '1. Inspect the failed job logs for details',
                '2. Reproduce locally with `pnpm exec osv-scanner --lockfile=pnpm-lock.yaml`',
                '3. Update the affected package: `pnpm update <package>`',
                '4. If no fix is available, add a `pnpm.overrides` entry pinning a safe version',
              ].join('\n'),
              labels: ['security', 'dependencies', 'automated'],
            });
