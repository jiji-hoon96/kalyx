name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kalyx/core build
      - run: pnpm --filter @kalyx/adapter-date-fns build
      - run: pnpm test:run --coverage
      - name: 커버리지 업로드 (Node 22만)
        if: matrix.node == 22
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dist 아티팩트 보관 (bundle-size job 공유)
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}
          path: packages/react/dist/
          retention-days: 1

  bundle-size:
    name: Bundle Size (≤16KB gzip)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: dist 다운로드
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: packages/react/dist/
      - name: 크기 측정 및 판정
        id: check
        run: |
          BYTES=$(gzip -c packages/react/dist/index.js | wc -c)
          KB=$(echo "scale=2; $BYTES / 1024" | bc)
          MAX=16
          echo "gzip_kb=$KB" >> $GITHUB_OUTPUT
          echo "📦 번들 크기: ${KB}KB (목표: ≤${MAX}KB)"
          if (( $(echo "$KB > $MAX" | bc -l) )); then
            echo "❌ 초과: ${KB}KB > ${MAX}KB"; exit 1
          else
            echo "✅ OK: ${KB}KB ≤ ${MAX}KB"
          fi
      - name: PR 코멘트
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const kb   = '${{ steps.check.outputs.gzip_kb }}';
            const ok   = parseFloat(kb) <= 16;
            const icon = ok ? '✅' : '❌';
            const body = [

              '',
              '| | gzip |',
              '|---|---|',
              `| **현재** | **${kb}KB** |`,
              `| 목표 | ≤ 16KB |`,
              '',
              ok
                ? '번들 크기가 목표 이내입니다.'
                : '⚠️ 번들 크기가 목표를 초과했습니다. `pnpm check-bundle` 로 확인하세요.',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  ssr-check:
    name: SSR Safety Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Node.js에서 직접 import 테스트 (SSR 시뮬레이션)
        run: |
          node -e "
            const lib = require('./packages/react/dist/index.cjs');
            console.log('CJS exports:', Object.keys(lib).join(', '));
            console.log('✅ CJS import 성공');
          "
          node --input-type=module -e "
            import('./packages/react/dist/index.js').then(lib => {
              console.log('ESM exports:', Object.keys(lib).join(', '));
              console.log('✅ ESM import 성공');
            });
          "

  docs-site:
    name: Docs Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kalyx/core build
      - run: pnpm --filter @kalyx/adapter-date-fns build
      - run: pnpm --filter @kalyx/react build
      - run: pnpm --filter docs-site build

  hero-freshness:
    name: Hero WebP Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-hero-freshness.mjs

  all-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build, bundle-size, ssr-check, docs-site, hero-freshness]
    if: always()
    steps:
      - name: 결과 확인
        run: |
          results='${{ toJSON(needs) }}'
          if echo "$results" | grep -q '"result":"failure"'; then
            echo "❌ 일부 검사 실패"
            exit 1
          fi
          echo "✅ 모든 검사 통과"
