name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kalyx/core build
      - run: pnpm --filter @kalyx/adapter-date-fns build
      # HeroDemo tests in apps/docs-site import from @kalyx/react,
      # so it must be built before vitest can resolve the package entry.
      - run: pnpm --filter @kalyx/react build
      - run: pnpm test:run --coverage
      - name: 커버리지 업로드 (Node 22만)
        if: matrix.node == 22
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: dist 아티팩트 보관 (bundle-size job 공유)
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}
          path: packages/react/dist/
          retention-days: 1

  package-smoke:
    name: Package Tarball Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-package-tarballs

  bundle-size:
    name: Bundle Size (gzip ceiling)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: dist 다운로드
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.run_id }}
          path: packages/react/dist/
      # Single source of truth for gzip measurement: shell `gzip -c` and Node's
      # zlib could drift apart inside the tight gzip margin, so we delegate
      # to scripts/check-bundle-size.js — the same script tsup + local dev use.
      # The script appends kb_esm and kb_cjs to $GITHUB_OUTPUT for the comment.
      - name: 크기 측정 및 판정
        id: check
        run: node scripts/check-bundle-size.js
      # Bundle diff (B9): measure the base ref so the PR comment can show the
      # byte-level delta + remaining margin, not just the absolute size. The
      # working margin is small and CJS-bound — a few hundred bytes can break
      # the gate, so per-PR delta visibility prevents silent ceiling breaks.
      - name: base ref 번들 측정 (delta용)
        id: base
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git worktree add /tmp/base-ref "${{ github.event.pull_request.base.sha }}"
          pnpm --dir /tmp/base-ref install --frozen-lockfile
          pnpm --dir /tmp/base-ref build
          ESM=$(node -e "import('${{ github.workspace }}/scripts/check-bundle-size.js').then(m => process.stdout.write(String(m.getGzipBytes('/tmp/base-ref/packages/react/dist/index.js'))))")
          CJS=$(node -e "import('${{ github.workspace }}/scripts/check-bundle-size.js').then(m => process.stdout.write(String(m.getGzipBytes('/tmp/base-ref/packages/react/dist/index.cjs'))))")
          HEADLESS_ESM=$(node -e "import('${{ github.workspace }}/scripts/check-bundle-size.js').then(m => process.stdout.write(String(m.getGzipBytes('/tmp/base-ref/packages/react/dist/headless.js'))))")
          HEADLESS_CJS=$(node -e "import('${{ github.workspace }}/scripts/check-bundle-size.js').then(m => process.stdout.write(String(m.getGzipBytes('/tmp/base-ref/packages/react/dist/headless.cjs'))))")
          echo "esm=$ESM" >> "$GITHUB_OUTPUT"
          echo "cjs=$CJS" >> "$GITHUB_OUTPUT"
          echo "headless_esm=$HEADLESS_ESM" >> "$GITHUB_OUTPUT"
          echo "headless_cjs=$HEADLESS_CJS" >> "$GITHUB_OUTPUT"
          git worktree remove --force /tmp/base-ref
      - name: 번들 diff 계산
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BUNDLE_BASE_ESM: ${{ steps.base.outputs.esm }}
          BUNDLE_BASE_CJS: ${{ steps.base.outputs.cjs }}
          BUNDLE_BASE_HEADLESS_ESM: ${{ steps.base.outputs.headless_esm }}
          BUNDLE_BASE_HEADLESS_CJS: ${{ steps.base.outputs.headless_cjs }}
        run: node scripts/bundle-diff.mjs
      - name: PR 코멘트
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.diff.outputs.comment }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.COMMENT_BODY,
            });

  ssr-check:
    name: SSR Safety Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Node.js에서 직접 import 테스트 (SSR 시뮬레이션)
        run: |
          node -e "
            const lib = require('./packages/react/dist/index.cjs');
            console.log('CJS exports:', Object.keys(lib).join(', '));
            console.log('✅ CJS import 성공');
          "
          node --input-type=module -e "
            import('./packages/react/dist/index.js').then(lib => {
              console.log('ESM exports:', Object.keys(lib).join(', '));
              console.log('✅ ESM import 성공');
            });
          "

  docs-site:
    name: Docs Site Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kalyx/core build
      - run: pnpm --filter @kalyx/adapter-date-fns build
      - run: pnpm --filter @kalyx/react build
      # The dayjs and luxon adapters are needed too: `api/react.md` imports both,
      # and `check-doc-examples` resolves them from `dist/*.d.ts`. Without these
      # the checker fails only in CI, since a local `dist/` left over from an
      # earlier build hides it.
      - run: pnpm --filter @kalyx/adapter-dayjs build
      - run: pnpm --filter @kalyx/adapter-luxon build
      - run: pnpm check-doc-examples
      - run: pnpm --filter docs-site build

  hero-freshness:
    name: Hero WebP Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-hero-freshness.mjs

  entry-split:
    name: Headless Entry Split (no date-fns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # esbuild resolves @kalyx/* through the workspace packages' `main`/
      # `module` fields, which point at `dist/`. Pre-build those packages so
      # esbuild can find them. We don't need @kalyx/react built — the script
      # bundles its `src/` directly.
      - run: pnpm --filter @kalyx/core build
      - run: pnpm --filter @kalyx/adapter-date-fns build
      # Regression-guard for the `/headless` contract: the headless entry must
      # NOT pull in date-fns or @kalyx/adapter-date-fns. The script bundles
      # both entries with esbuild and asserts the headless metafile is
      # date-fns-free. The percentage delta is informational because the two
      # entries expose different hook surfaces.
      - run: node scripts/verify-entry-split.mjs

  validation-tools:
    name: Accessibility and Consumer Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check-a11y
      - run: pnpm check-tree-shaking

  all-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs:
      [
        typecheck,
        lint,
        test,
        build,
        package-smoke,
        bundle-size,
        ssr-check,
        docs-site,
        hero-freshness,
        entry-split,
        validation-tools,
      ]
    if: always()
    steps:
      # `toJSON(needs)` serialises with `": "` (space after colon), so the
      # previous `grep -q '"result":"failure"'` (no space) never matched —
      # any failure in a dependent job slipped through this gate. Use the
      # built-in `contains(needs.*.result, …)` instead; it operates on the
      # parsed object, not the serialised string.
      - name: 결과 확인
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ 일부 검사 실패"
          exit 1
      - run: echo "✅ 모든 검사 통과"
