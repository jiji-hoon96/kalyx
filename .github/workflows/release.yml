name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 태그·릴리즈 생성
      pull-requests: write  # Version PR 생성·업데이트
      id-token: write       # npm provenance (공급망 보안)
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets가 전체 git 히스토리 필요
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 24 ships with npm 11.x which is required for Trusted Publishing
      # (OIDC-based publish without NPM_TOKEN). Node 22 ships with npm 10.x
      # which only supports provenance signing, not actual OIDC publish.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify npm version (need >= 11.5.1 for Trusted Publishing)
        run: npm --version

      - run: pnpm install --frozen-lockfile

      # 릴리즈 전 최종 품질 검사
      - name: 빌드
        run: pnpm build

      - name: 테스트 (릴리즈 전 최종 검증)
        run: pnpm test:run

      - name: 번들 크기 확인
        run: |
          BYTES=$(gzip -c packages/react/dist/index.js | wc -c)
          KB=$(echo "scale=2; $BYTES / 1024" | bc)
          MAX=16
          echo "📦 릴리즈 번들 크기: ${KB}KB (목표: ≤${MAX}KB)"
          if (( $(echo "$KB > $MAX" | bc -l) )); then
            echo "❌ 번들 크기 ${MAX}KB 초과 — 릴리즈 중단"
            exit 1
          fi

      - name: Changesets 릴리즈
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore: release packages"
          commit: "chore: release packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # 릴리즈 성공 시 Slack/Discord 알림 (선택적)
      - name: 릴리즈 알림
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [ -f ./packages/react/package.json ]; then
            VERSION=$(node -p "require('./packages/react/package.json').version")
            echo "🎉 @kalyx/react@$VERSION 릴리즈 완료"
          else
            echo "⚠️ package.json not found, skipping version log"
          fi
          # Slack/Discord 웹훅은 NOTIFICATION_WEBHOOK secret에 추가
          # curl -X POST ${{ secrets.NOTIFICATION_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   --data "{\"text\":\"🎉 @kalyx/react@$VERSION released!\"}"