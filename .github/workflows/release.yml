name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 태그·릴리즈 생성
      pull-requests: write  # Version PR 생성·업데이트
      id-token: write       # npm provenance (공급망 보안)
    steps:
      - uses: actions/checkout@v6
        with:
          # Changesets가 전체 git 히스토리 필요
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # Node 24 ships with npm 11.x which is required for Trusted Publishing
      # (OIDC-based publish without NPM_TOKEN). Node 22 ships with npm 10.x
      # which only supports provenance signing, not actual OIDC publish.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify npm version (need >= 11.5.1 for Trusted Publishing)
        run: npm --version

      - run: pnpm install --frozen-lockfile

      # 릴리즈 전 최종 품질 검사
      - name: 빌드
        run: pnpm build

      - name: 테스트 (릴리즈 전 최종 검증)
        run: pnpm test:run

      - name: 번들 크기 확인
        # Single source of truth for the gzip ceiling + measurement:
        # scripts/check-bundle-size.js (TARGET_KB) — the same gate pr-check.yml
        # and tsup use. Avoids the stale inline 16KB limit that blocked 1.2.0
        # after the ceiling was raised to 17KB (B10 A-G1).
        run: node scripts/check-bundle-size.js

      - name: Changeset 검증 (ignored/publishable 혼합 차단)
        # Fail early on the changesets footgun: a changeset that bumps both an
        # `ignore`d package (docs / @kalyx-example/*) and a publishable one makes
        # `changeset publish` fail mid-release. This turns that opaque failure
        # into an actionable pre-flight error. (See AGENTS.md §14 cleanup #3.)
        run: node scripts/verify-changesets.mjs

      - name: Changesets 릴리즈
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore: release packages"
          commit: "chore: release packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # 릴리즈 성공 시 Slack/Discord 알림 (선택적)
      - name: 릴리즈 알림
        if: steps.changesets.outputs.published == 'true'
        run: |
          if [ -f ./packages/react/package.json ]; then
            VERSION=$(node -p "require('./packages/react/package.json').version")
            echo "🎉 @kalyx/react@$VERSION 릴리즈 완료"
          else
            echo "⚠️ package.json not found, skipping version log"
          fi
          # Slack/Discord 웹훅은 NOTIFICATION_WEBHOOK secret에 추가
          # curl -X POST ${{ secrets.NOTIFICATION_WEBHOOK }} \
          #   -H 'Content-type: application/json' \
          #   --data "{\"text\":\"🎉 @kalyx/react@$VERSION released!\"}"